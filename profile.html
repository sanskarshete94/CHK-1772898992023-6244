<!DOCTYPE html>
<html>
<head>
<title>Profile - MicroIntern</title>
<link rel="stylesheet" href="style.css">

<style>

body{
font-family:'Segoe UI',sans-serif;
background:linear-gradient(135deg,#0a66c2,#00c6ff,#7b2ff7);
height:100vh;
display:flex;
align-items:center;
justify-content:center;
margin:0;
}

.profile-container{
width:420px;
background:white;
border-radius:15px;
box-shadow:0 15px 40px rgba(0,0,0,0.2);
overflow:hidden;
}

.profile-header{
background:linear-gradient(135deg,#0a66c2,#00c6ff);
color:white;
padding:30px;
text-align:center;
}

.profile-content{
padding:30px;
}

.info{
margin:15px 0;
font-size:16px;
padding:10px;
border-radius:8px;
background:#f4f6f9;
}

.resume-box{
margin-top:20px;
padding:15px;
border-radius:8px;
background:#f4f6f9;
text-align:center;
}

button{
padding:10px 20px;
border:none;
border-radius:6px;
cursor:pointer;
margin-top:10px;
background:#0a66c2;
color:white;
}

</style>
</head>

<body>

<div class="profile-container">

<div class="profile-header">
<h2>Student Profile</h2>
</div>

<div class="profile-content">

<div class="info"><b>Name:</b> <span id="name"></span></div>
<div class="info"><b>Email:</b> <span id="email"></span></div>
<div class="info"><b>College:</b> <span id="college"></span></div>
<div class="info"><b>Mobile:</b> <span id="mobile"></span></div>

<div class="info">
<b>Skills</b><br>
<input type="text" id="skillsInput" placeholder="Enter skills">
<button onclick="saveSkills()">Save Skills</button>
<p id="skillsDisplay"></p>
</div>

<div class="resume-box">
<b>Upload Resume</b><br>
<input type="file" id="resume">
<p id="resumeName"></p>
</div>

</div>
</div>

<!-- Supabase Library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* SUPABASE CONNECTION */

const supabaseUrl = "https://bykpuujrmfkhvtmswoiv.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ5a3B1dWpybWZraHZ0bXN3b2l2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxMDQ4ODQsImV4cCI6MjA4ODY4MDg4NH0.i_I9yOKrhz1JveCSdLUj4KS3VHoGFSH-DwnN7Asn6XY";

const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);


/* DISPLAY PROFILE FROM LOCAL STORAGE */

document.getElementById("name").innerText = localStorage.getItem("name") || "Not set";
document.getElementById("email").innerText = localStorage.getItem("email") || "Not set";
document.getElementById("college").innerText = localStorage.getItem("college") || "Not set";
document.getElementById("mobile").innerText = localStorage.getItem("mobile") || "Not set";


/* LOAD SAVED SKILLS */

let savedSkills = localStorage.getItem("skills");

if(savedSkills){
document.getElementById("skillsDisplay").innerText = savedSkills;
document.getElementById("skillsInput").value = savedSkills;
}


/* SAVE DATA TO SUPABASE */

async function saveSkills(){

let skills = document.getElementById("skillsInput").value;

let name = localStorage.getItem("name");
let email = localStorage.getItem("email");
let college = localStorage.getItem("college");
let mobile = localStorage.getItem("mobile");

localStorage.setItem("skills",skills);
document.getElementById("skillsDisplay").innerText = skills;

const { data, error } = await supabaseClient
.from("users")
.insert([
{
name:name,
email:email,
college:college,
mobile:mobile,
skills:skills
}
]);

if(error){
console.log(error);
alert("Error saving data: " + error.message);
}else{
alert("Profile saved successfully!");
}

}


/* RESUME DISPLAY */

document.getElementById("resume").addEventListener("change",function(){

let file=this.files[0];

if(file){
localStorage.setItem("resumeName",file.name);
document.getElementById("resumeName").innerText="Uploaded: "+file.name;
}

});

</script>

</body>
</html>
